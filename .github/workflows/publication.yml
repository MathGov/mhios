name: Verify and publish MHIOS
on:
  push:
    branches: [main]
    tags: ['v2.1-core13.0']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: releases/v2.1/requirements.txt
      - run: pip install -r releases/v2.1/requirements.txt
      - run: python -B releases/v2.1/verify_all.py --output-dir verification-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: verification-output/
  build-pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy reading site
        id: deployment
        uses: actions/deploy-pages@v4
