<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHIOS MVS-0.1</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fa;color:#17212b}header{background:#174f7a;color:white;padding:16px}nav{display:flex;gap:8px;padding:12px;background:white;position:sticky;top:0}button{padding:10px 14px;border:1px solid #8aa6bb;background:#fff;border-radius:6px}button.active{background:#1f6b99;color:white}main{max-width:1000px;margin:20px auto;background:white;padding:24px;border-radius:10px}.card{border:1px solid #c9d6df;padding:14px;margin:12px 0;border-radius:8px}.boundary{background:#fff4d6;border-left:5px solid #d89b00;padding:12px}</style></head><body><header><h1>MHIOS Minimal Vertical Slice v0.1</h1><p>12 objects, five screens, one Tier 2 retrospective case. No decision authority or production claim.</p></header><nav id="nav"></nav><main id="main"></main><script>const screens=[['Run Setup','Define the decision, options, configuration, tier, reviewers, and frozen branch.'],['Claims & Evidence','Enter claims, evidence, assumptions, unknowns, and the independent reviewer first pass.'],['Stakeholders & Grounding','Map affected stakeholders, declare the reality surface, claim boundary, and RG state.'],['Qualify & Rank','Run RF/NCRC, TRC, CSV, short-circuit failures, form the selectable set, and calculate one transparent RLS result.'],['Review, Export & Replay','Record reviewer judgment, challenges, framework result, export JSON/report, and replay independently.']];let active=0;function draw(){nav.innerHTML='';screens.forEach((s,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+s[0];b.className=i===active?'active':'';b.onclick=()=>{active=i;draw()};nav.appendChild(b)});main.innerHTML='<h2>'+screens[active][0]+'</h2><div class="card"><p>'+screens[active][1]+'</p></div><div class="boundary"><strong>Claim boundary:</strong> This static wireframe demonstrates flow only. It does not verify evidence, determine a gate, or establish usability.</div>'}draw();</script></body></html>
