  AuthoritySelectionRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Judgment selection lacks lawful or institutional mandate.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a retrospective or prospective case
      shows material error prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  ExecutionMandateRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Execution relies on an unversioned, expired, revoked,
      superseded, conflicted, unverified, scope-inapplicable, or untraceable human-defined
      permission.
    current_evidence_status: STRUCTURAL_AND_TEMPORAL_TESTS_ONLY
    retention_rule: Retain as a separate conditional object only if execution authorization
      is in scope and permission provenance or currency is load-bearing.
    demotion_rule: Keep outside the default MVS interaction surface; combine presentation
      with authorization only when the exported record remains separately typed and
      replayable.
  ExecutionAuthorization:
    implementation_class: CONDITIONAL
    intended_error_prevented: Selection is treated as execution permission without
      current mandate, exact configuration binding, current evidence, verified controls,
      satisfied preconditions, or named stop and recovery authority.
    current_evidence_status: STRUCTURAL_AND_TEMPORAL_TESTS_ONLY
    retention_rule: Retain or promote only if a retrospective or prospective case
