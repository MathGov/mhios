    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  RefusalRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: An underdetermined run can be silently recoded as pass,
      failure, or ordinary authority choice.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  ComputationalClosureRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Public claims can silently exceed the scopes, horizons,
      externalities, or propagation paths actually computed.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  CoreRecordAttachment:
    implementation_class: CONDITIONAL
    intended_error_prevented: A generic file link can conceal the wrong version, missing
      schema validation, or a record that does not satisfy the triggered claim surface.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  SuccessorRequalificationRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Technical lineage, retraining, fine-tuning, composition,
      or self-modification is used to inherit authority or conceal invalidated evidence
      and controls.
    current_evidence_status: DESIGN_RATIONALE_AND_STRUCTURAL_TESTS_ONLY
    retention_rule: Retain only if pilots show improved detection of material configuration
      drift, authority inheritance, stale evaluation, or recursive-control failure.
    demotion_rule: Simplify or demote fields that add burden without detecting material
      successor risk or improving reconstructability.
