  BurdenObservation:
    implementation_class: ADVANCED_RESEARCH
    intended_error_prevented: The standard cannot learn which requirements add burden
      without assurance.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a retrospective or prospective case
      shows material error prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  CapabilityAuthorityDecompositionRecord:
    class: CONDITIONAL
    why_needed: Prevents scalar autonomy or agentic labels from collapsing candidate
      generation, references, constraints, objectives, admissibility warrants, execution
      interfaces, authority, revocation, safe state, and requalification.
    risk_if_absent: Marketing or architecture labels may be mistaken for capability,
      safety, lawful authority, or execution permission.
  MaterialObligationRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: A control label or owner can exist while authority,
      capacity, handoff, escalation, expiry, and effectiveness remain absent.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  ConsequenceTempoRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Nominal stop controls can be slower than consequence
      propagation or irreversible harm.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  ResponsibilityContinuityRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Multi-party handoffs can convert advice into authority
      or distribute responsibility into no responsibility.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  HumanCompensationLoadRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Automation or scaling can remove hidden work that was
      sustaining reliability and recovery.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
      prevention, assurance improvement, or required traceability.
    demotion_rule: Demote, combine, or remove from the default interaction surface
      when it adds burden without measurable assurance value.
  ProjectionPreRegistrationRecord:
    implementation_class: CONDITIONAL
    intended_error_prevented: Outcome-sensitive tuning can make a purported validation
      run post hoc and non-falsifiable.
    current_evidence_status: DESIGN_RATIONALE_ONLY
    retention_rule: Retain or promote only if a case or pilot shows material error
