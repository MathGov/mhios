version: '0.8'
unit: executable_check
claim_boundary: A listed executable surface establishes only the declared structural
  or procedural check. It does not establish evidence truth, construct validity, legal
  validity, domain validity, usability, burden reduction, or institutional effectiveness.
checks:
  T-CASCADE:
    coverage_kind: PARTIAL_EXECUTABLE
    match_patterns:
    - controlling sequence
    - headline cascade
    evidence_paths:
    - release/VERIFY_MHIOS_PACKAGE.py
    - tests/conformance_vectors/pass_tier1_office_procurement.json
    - tests/conformance_vectors/pass_tier2_remote_work_policy.json
    - tests/conformance_vectors/pass_tier3_autonomous_shuttle_pilot.json
    establishes:
    - static_token_presence
  T-EXPERIMENTAL-BOUNDARY:
    coverage_kind: PARTIAL_EXECUTABLE
    match_patterns:
    - validated universal
    - ARTIFACT_INTEGRITY_PASS
    - construct validity
    evidence_paths:
    - release/VERIFY_MHIOS_PACKAGE.py
    - docs/MHIOS_SELF_ASSESSMENT_AND_CLAIM_BOUNDARY_v0_8.md
    establishes:
    - static_claim_boundary
  T-UNIQUE-ID:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - stable identifier
    - Identifiers MUST remain stable
    evidence_paths:
    - tests/validate_mhios.py
    establishes:
    - identifier_integrity
  T-TIER-DIVERGENCE:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - downward deviation
    - tier divergence
    - recommended tier
    evidence_paths:
    - tests/conformance_vectors/fail_silent_tier_downgrade.json
    - tests/validate_mhios.py
    establishes:
    - tier_divergence_rejection
  T-AI-AUTHORITY:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - AI MUST NOT independently
    - AI-generated
    - AI suggestion
    evidence_paths:
    - tests/conformance_vectors/fail_ai_authorized_without_human_review.json
    - tests/conformance_vectors/fail_ai_origin_missing_review.json
    - tests/validate_mhios.py
    establishes:
    - ai_authority_rejection
  T-AI-FIRST-PASS:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - independent first pass
    - independent-first-pass
    evidence_paths:
    - tests/conformance_vectors/fail_ai_gate_material_without_first_pass.json
    - tests/validate_mhios.py
    establishes:
    - human_first_pass_enforcement
  T-NO-AI-MODE:
    coverage_kind: PARTIAL_EXECUTABLE
    match_patterns:
    - AI assistance is disabled
    - AI disabled
    evidence_paths:
    - tests/validate_mhios.py
    - examples/tier2_remote_work_policy.json
    establishes:
    - declared_no_ai_mode_structure
  T-CONFLICT:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - stale revision
    - UNRESOLVED
    - last-write-wins
    - silently overwrite
    evidence_paths:
    - tests/conformance_vectors/fail_unresolved_conflict_at_authority.json
    - tests/conformance_vectors/fail_current_view_with_source_mismatch.json
    - tests/validate_mhios.py
    - tests/conformance_vectors/fail_dangling_source_link.json
    establishes:
    - conflict_blocking
  T-INSTITUTION:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - Institutional Preconditions
    - institutional precondition
    evidence_paths:
    - tests/conformance_vectors/fail_c2_without_institutional_preconditions.json
    - tests/validate_mhios.py
    establishes:
    - institutional_precondition_presence
  T-UNKNOWN:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - unknown
    - missing value
    evidence_paths:
    - tests/conformance_vectors/fail_unknown_disappears.json
    - tests/validate_mhios.py
    establishes:
    - unknown_preservation
  T-CONTROL-OWNER:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - control owner
    - named responsible
    evidence_paths:
    - tests/conformance_vectors/fail_missing_control_owner.json
    - tests/validate_mhios.py
    establishes:
    - control_ownership_presence
  T-EXEC-AUTHORITY:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - execution authority
    - shutdown authority
    - rollback authority
    evidence_paths:
    - tests/conformance_vectors/fail_authorization_without_named_authority.json
    - tests/validate_mhios.py
    - tests/conformance_vectors/fail_computational_context_capability_as_authority_v08.json
    - tests/conformance_vectors/fail_computational_context_interface_as_authority_v08.json
