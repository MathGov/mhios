    - tests/conformance_vectors/fail_execution_authorization_not_yet_effective_v07.json
    - tests/conformance_vectors/fail_execution_mandate_not_yet_effective_v07.json
    - tests/conformance_vectors/fail_execution_inactive_required_control_v07.json
    - tests/conformance_vectors/fail_execution_missing_configuration_binding_v07.json
    - tests/conformance_vectors/fail_execution_unsatisfied_precondition_v07.json
    establishes:
    - mandate_currency_and_binding
  T-DECISION-STATE:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - decisiveness
    - framework verdict
    - selectable set
    evidence_paths:
    - tests/conformance_vectors/fail_contradictory_decisiveness.json
    - tests/validate_mhios.py
    establishes:
    - decision_state_consistency
  T-RLS-PRECONDITION:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - RLS MUST remain unavailable
    - RLS enabled only
    evidence_paths:
    - tests/conformance_vectors/fail_rls_before_selectable_set.json
    - tests/validate_mhios.py
    establishes:
