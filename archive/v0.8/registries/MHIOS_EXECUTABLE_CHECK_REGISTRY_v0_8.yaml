  T-EVENT-SCHEMA:
    coverage_kind: PARTIAL_EXECUTABLE
    match_patterns:
    - InteractionEvent
    - material transition MUST create
    evidence_paths:
    - schemas/mhios_interaction_event_v0_8.schema.json
    - release/VERIFY_MHIOS_PACKAGE.py
    establishes:
    - event_schema_validity
  T-REALITY-SURFACE:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - reality_surface
    - consequence_pathways
    - Reality Surface
    - Consequence Pathways
    evidence_paths:
