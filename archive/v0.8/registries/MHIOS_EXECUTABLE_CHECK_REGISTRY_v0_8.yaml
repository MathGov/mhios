  T-STALE-EVIDENCE:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - stale item
    - stale evidence
    evidence_paths:
    - tests/conformance_vectors/fail_stale_gate_evidence_without_disposition.json
    - tests/validate_mhios.py
    - tests/conformance_vectors/fail_computational_context_capability_outside_domain_v08.json
