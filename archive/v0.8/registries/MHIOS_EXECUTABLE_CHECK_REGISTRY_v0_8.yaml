  T-SCHEMA-REQUIRED:
    coverage_kind: PARTIAL_EXECUTABLE
    match_patterns:
    - Every material field MUST carry
    - full conforming structured run MUST include
    evidence_paths:
    - schemas/mhios_run_export_v0_8.schema.json
    - tests/validate_mhios.py
    - tests/conformance_vectors/fail_capability_decomposition_compound_field_v04.json
    - tests/conformance_vectors/fail_capability_decomposition_missing_safe_state_v04.json
    - tests/conformance_vectors/fail_computational_context_missing_configuration_v08.json
    - tests/conformance_vectors/fail_execution_blank_authorization_basis_v07.json
    - tests/conformance_vectors/fail_execution_empty_controls_without_disposition_v07.json
    - tests/conformance_vectors/fail_execution_empty_preconditions_without_disposition_v07.json
    - tests/conformance_vectors/fail_execution_invalid_action_specification_hash_v07.json
    - tests/conformance_vectors/fail_execution_invalid_qualification_snapshot_hash_v07.json
    - tests/conformance_vectors/fail_execution_missing_action_instance_v07.json
    - tests/conformance_vectors/fail_invalid_responsible_role.json
    - tests/conformance_vectors/fail_mfdi_missing_claim_domain_v04.json
    - tests/conformance_vectors/fail_mfdi_missing_necessity_check.json
    - tests/conformance_vectors/fail_unknown_object_type.json
