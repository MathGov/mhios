  T-MANDATE-CURRENCY:
    coverage_kind: DIRECT_EXECUTABLE
    match_patterns:
    - ExecutionMandateRecord
    - mandate.*effective
    - mandate.*revok
    - mandate.*supersed
    - mandate_snapshot_hash
    - authorization_basis_ref
    - authorization-evaluation time
    - configuration binding
    - current mandate
    evidence_paths:
    - tests/conformance_vectors/fail_execution_mandate_expired_v07.json
    - tests/conformance_vectors/fail_execution_mandate_revoked_v07.json
    - tests/conformance_vectors/fail_mandate_snapshot_hash_mismatch_v07.json
